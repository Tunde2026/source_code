<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClickOn - Typing Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --primary: #3b82f6;
        --primary-hover: #60a5fa;
        --text-main: #ffffff;
        --text-muted: #94a3b8;
        --error: #ef4444;
        --success: #22c55e;
        --radius: 16px;
        --transition: all 0.3s ease;
        --nav-height: 80px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg);
        color: var(--text-main);
        font-family: "Inter", sans-serif;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }

      /* --- AUTH LOADING OVERLAY --- */
      #auth-guard {
        position: fixed;
        inset: 0;
        background: var(--bg);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(59, 130, 246, 0.3);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        background: var(--bg);
        color: var(--text-main);
        overflow-x: hidden;
      }

      /* NAV (same style as home) */

      nav {
        position: fixed;
        top: 0;
        width: 100%;
        height: var(--nav-height);
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(100px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 5%;
        border-bottom: 2px solid rgb(255, 255, 255);
      }

      .brand {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: var(--text-main);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand span {
        color: var(--primary);
      }

      .nav-links {
        display: flex;
        gap: 32px;
        align-items: center;
      }

      .nav-links a {
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 500;
        font-size: 15px;
        transition: var(--transition);
      }

      .nav-links a:hover,
      .nav-links a.active {
        color: var(--text-main);
        border-bottom: 2px solid white;
      }

      .nav-right {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 10px;
      }

      .hamburger {
        display: none;
        background: none;
        border: none;
        color: var(--text-main);
        font-size: 24px;
        cursor: pointer;
      }

      /* --- BUTTONS --- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 28px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        transition: var(--transition);
        cursor: pointer;
        border: none;
      }

      .btn-primary {
        background: var(--primary);
        color: white;
        box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
      }

      .btn-primary:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
      }

      .btn-secondary {
        background: var(--card);
        color: var(--text-main);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.05);
        transform: translateY(-2px);
      }
      .btn-logout {
        background: transparent;
        color: var(--text-main);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
      }

      .btn-logout:hover {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border-color: rgba(239, 68, 68, 0.2);
      }
      /* --- MAIN TYPING INTERFACE --- */
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(var(--nav-height) + 40px) 5% 60px;
      }

      .typing-container {
        width: 100%;
        max-width: 900px;
        display: flex;
        flex-direction: column;
        gap: 30px;
      }

      .stats-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--card);
        padding: 20px 30px;
        border-radius: var(--radius);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
      }

      .stat-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .stat-label {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .stat-value {
        font-size: 28px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .stat-value.timer {
        color: var(--primary);
      }

      .progress-container {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 6px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        background: var(--primary);
        width: 0%;
        transition: width 1s linear;
      }

      .text-box {
        position: relative;
        background: var(--card);
        padding: 40px;
        border-radius: var(--radius);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
        cursor: text;
      }

      /* Hidden input to capture mobile/desktop keystrokes naturally */
      #hidden-input {
        opacity: 0;
        position: absolute;
        z-index: -999;
        top: 0;
        left: 0;
      }

      .typing-text {
        font-family: "JetBrains Mono", monospace;
        font-size: 24px;
        line-height: 1.7;
        color: var(--text-muted);
        word-break: break-word;
        user-select: none;
      }

      .typing-text span {
        position: relative;
        transition: color 0.1s;
      }

      .typing-text span.correct {
        color: var(--text-main);
      }

      .typing-text span.incorrect {
        color: var(--error);
        background: rgba(239, 68, 68, 0.2);
        border-radius: 2px;
      }

      .typing-text span.active {
        color: var(--text-main);
      }

      /* Blinking cursor */
      .typing-text span.active::before {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 2px;
        height: 100%;
        background-color: var(--primary);
        animation: blink 1s infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 16px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: var(--transition);
      }

      .btn-primary {
        background: var(--primary);
        color: white;
        box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
      }

      .btn-primary:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: transparent;
        color: var(--text-muted);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-main);
        transform: translateY(-2px);
      }

      /* --- RESULTS MODAL --- */
      #results-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(8px);
        z-index: 2000;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .results-card {
        background: var(--card);
        border-radius: 24px;
        padding: 50px;
        width: 100%;
        max-width: 600px;
        text-align: center;
        border: 1px solid rgba(59, 130, 246, 0.3);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }

      .results-title {
        font-size: 32px;
        font-weight: 800;
        margin-bottom: 8px;
      }

      .performance-msg {
        color: var(--primary);
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 40px;
      }

      .results-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
        margin-bottom: 40px;
      }

      .result-item {
        background: rgba(255, 255, 255, 0.03);
        padding: 24px;
        border-radius: var(--radius);
      }

      .result-item .value {
        font-size: 36px;
        font-weight: 800;
        color: var(--text-main);
      }

      .result-item.highlight .value {
        color: var(--success);
      }

      .result-item.error-box .value {
        color: var(--error);
      }

      @media (max-width: 768px) {
        .nav-links {
          display: none;
        }
        .stats-header {
          flex-wrap: wrap;
          gap: 20px;
          justify-content: center;
        }
        .typing-text {
          font-size: 20px;
        }
        .results-grid {
          grid-template-columns: 1fr;
        }
        .results-card {
          padding: 30px 20px;
        }
      }
      #chat-bubble {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #3b82f6;
        color: white;
        width: 55px;
        height: 55px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 22px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }

      #chat-box {
        position: fixed;
        bottom: 90px;
        right: 20px;
        width: 320px;
        height: 420px;
        background: #1e293b;
        border-radius: 16px;
        display: none;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      #chat-header {
        padding: 12px;
        background: #0f172a;
        color: white;
        font-weight: bold;
      }

      #chat-messages {
        flex: 1;
        padding: 10px;
        overflow-y: auto;
        color: white;
      }

      #chat-input-area {
        display: flex;
        padding: 10px;
        gap: 5px;
      }

      #chat-input {
        flex: 1;
        padding: 8px;
        border-radius: 8px;
        border: none;
      }

      #send-btn {
        background: #3b82f6;
        border: none;
        color: white;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- <div id="auth-guard">
        <div class="spinner"></div>
    </div> -->

    <nav>
      <a href="index.html" class="brand"> Click<span>On</span> </a>

      <div class="nav-menu" id="nav-menu">

      <button class="hamburger" id="hamburger-btn">
        <svg

          width="24"
          height="24"
        >
          <path
            d="M300.3 440.8C312.9 451 331.4 450.3 343.1 438.6L471.1 310.6C480.3 301.4 483 287.7 478 275.7C473 263.7 461.4 256 448.5 256L192.5 256C179.6 256 167.9 263.8 162.9 275.8C157.9 287.8 160.7 301.5 169.9 310.6L297.9 438.6L300.3 440.8z"
          />

    </nav>

    <main>
      <div class="typing-container">
        <div class="stats-header">
          <div class="stat-box">
            <span class="stat-label">Time</span>
            <span class="stat-value timer" id="time-left">120s</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">WPM</span>
            <span class="stat-value" id="wpm-live">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Errors</span>
            <span class="stat-value" id="errors-live">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Accuracy</span>
            <span class="stat-value" id="accuracy-live">100%</span>
          </div>
        </div>

        <div class="progress-container">

        <div class="text-box" id="typing-box">
          <input
            type="text"

          />
          <div class="typing-text" id="typing-text"></div>
        </div>

        <div class="controls">
          <button class="btn btn-primary" id="btn-restart">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
            Restart Test
          </button>
          
        </div>
      </div>

    <div id="results-modal">
      <div class="results-card">
        <h2 class="results-title">Test Complete!</h2>
        <div class="performance-msg" id="performance-msg">
          Excellent typing speed!
        </div>

        <div class="results-grid">
          <div class="result-item highlight">
            <div class="stat-label">Net WPM</div>

        <input id="chat-input" placeholder="Type a message..." />
        <button id="send-btn">Send</button>

    <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyArDmH7Qbxec6LTqPNj0FFp7kAQAfsfsmg",
    authDomain: "clickon-website.firebaseapp.com",
    projectId: "clickon-website",
    storageBucket: "clickon-website.firebasestorage.app",
    messagingSenderId: "832815696553",
    appId: "1:832815696553:web:c28bdc41070df46949b7b8",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // --- UI Elements ---
  const typingText = document.getElementById("typing-text");
  const hiddenInput = document.getElementById("hidden-input");
  const timeDisplay = document.getElementById("time-left");
  const wpmDisplay = document.getElementById("wpm-live");
  const errorsDisplay = document.getElementById("errors-live");
  const accuracyDisplay = document.getElementById("accuracy-live");
  const progressBar = document.getElementById("progress-bar");
  const resultsModal = document.getElementById("results-modal");

  let paragraphs = [];
  let lastIndex = -1;
  let timer, timeLeft, charIndex, errors, totalTyped, isTyping;
  const maxTime = 120;

  

  function loadParagraph() {
    if (paragraphs.length === 0) return;
    let randomIndex;
    do { randomIndex = Math.floor(Math.random() * paragraphs.length); } 
    while (randomIndex === lastIndex && paragraphs.length > 1);
    lastIndex = randomIndex;
    
    const text = paragraphs[randomIndex];
    typingText.innerHTML = text.split("").map(char => `<span>${char}</span>`).join("");
    typingText.querySelector("span").classList.add("active");
    resetTestVars();
  }

  function resetTestVars() {
    timeLeft = maxTime;
    charIndex = 0; errors = 0; totalTyped = 0; isTyping = false;
    hiddenInput.value = "";
    hiddenInput.disabled = false;
    timeDisplay.innerText = `${timeLeft}s`;
    wpmDisplay.innerText = "0";
    errorsDisplay.innerText = "0";
    accuracyDisplay.innerText = "100%";
    progressBar.style.width = "0%";
    resultsModal.style.display = "none";
  }

  function initTyping() {
    if (!isTyping) { timer = setInterval(updateTimer, 1000); isTyping = true; }
    const characters = typingText.querySelectorAll("span");
    const typedChar = hiddenInput.value.split("")[charIndex];

    if (charIndex < characters.length && timeLeft > 0) {
      if (typedChar == null) { // Handle backspace
        charIndex--;
        if (characters[charIndex].classList.contains("incorrect")) errors--;
        characters[charIndex].classList.remove("correct", "incorrect");
      } else {
        if (characters[charIndex].innerText === typedChar) characters[charIndex].classList.add("correct");
        else { characters[charIndex].classList.add("incorrect"); errors++; }
        charIndex++;
        totalTyped++;
      }
      characters.forEach(s => s.classList.remove("active"));
      if (charIndex < characters.length) characters[charIndex].classList.add("active");
      else endTest();
      updateLiveStats();
    }
  }

  function updateTimer() {
    if (timeLeft > 0) {
      timeLeft--;
      timeDisplay.innerText = `${timeLeft}s`;
      progressBar.style.width = `${((maxTime - timeLeft) / maxTime) * 100}%`;
    } else { endTest(); }
  }

  function updateLiveStats() {
    const timeUsed = (maxTime - timeLeft) / 60;
    if (timeUsed === 0) return;
    const grossWpm = Math.round((charIndex / 5) / timeUsed);
    const netWpm = Math.max(0, Math.round(grossWpm - (errors / timeUsed)));
    const acc = totalTyped > 0 ? Math.round(((totalTyped - errors) / totalTyped) * 100) : 100;
    
    wpmDisplay.innerText = netWpm;
    errorsDisplay.innerText = errors;
    accuracyDisplay.innerText = `${acc}%`;
  }

  function endTest() {
    clearInterval(timer);
    hiddenInput.disabled = true;
    const timeUsed = (maxTime - timeLeft) / 60 || 1/60;
    const netWpm = Math.max(0, Math.round(((charIndex/5) - errors) / timeUsed));
    
    document.getElementById("res-wpm").innerText = netWpm;
    document.getElementById("res-cpm").innerText = Math.round(charIndex / timeUsed);
    document.getElementById("res-errors").innerText = errors;
    document.getElementById("res-accuracy").innerText = accuracyDisplay.innerText;
    resultsModal.style.display = "flex";
  }

  // --- Auth & Events ---
  onAuthStateChanged(auth, (user) => {
    if (!user) window.location.replace("auth.html");
    else document.getElementById("user-email").textContent = user.email;
  });

  document.getElementById("btn-restart").addEventListener("click", loadParagraph);
  
  document.getElementById("btn-close-modal").addEventListener("click", loadParagraph);
  hiddenInput.addEventListener("input", initTyping);
  document.getElementById("typing-box").addEventListener("click", () => hiddenInput.focus());

  onSnapshot(collection(db, "typingTexts"), (snap) => {
    paragraphs = snap.docs.map(d => d.data().text);
    if (lastIndex === -1) loadParagraph();
  });
</script>
