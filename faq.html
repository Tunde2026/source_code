        :root {
        --bg: #0f172a;

        --text-main: #ffffff;

       * {
        margin: 0;

      body {
        background: var(--bg);
        color: var(--text-main);
        overflow-x: hidden;

         /* NAV (same style as home) */

      nav {
        position: fixed;
        top: 0;
        width: 100%;
        height: var(--nav-height);
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(100px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 5%;
        border-bottom: 2px solid rgb(255, 255, 255);
      }

      .brand {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: var(--text-main);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand span {
        color: var(--primary);
      }

      .nav-links {
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .nav-links a {
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 500;

        transition: var(--transition);
      }

      .nav-links a:hover,
      .nav-links a.active {
        color: var(--text-main);
        border-bottom: 2px solid white;
      }

      .nav-right {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 10px;
      }

      .hamburger {
        display: none;
        background: none;
        border: none;
        color: var(--text-main);
        font-size: 24px;
        cursor: pointer;
      }

      /* --- BUTTONS --- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 28px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        transition: var(--transition);
        cursor: pointer;
        border: none;
      }

      .btn-primary {
        background: var(--primary);
        color: white;
        box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
      }

      .btn-primary:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
      }

      .btn-secondary {
        background: var(--card);
        color: var(--text-main);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.05);
        transform: translateY(-2px);
      }
       .btn-logout {
        background: transparent;
        color: var(--text-main);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
      }

      .btn-logout:hover {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border-color: rgba(239, 68, 68, 0.2);
      }
       #chat-bubble {
  position: fixed;

}

#chat-box {
  position: fixed;

  right: 20px;
  width: 320px;
  height: 420px;
  background: #1e293b;
  border-radius: 16px;
  display: none;
  flex-direction: column;
  overflow: hidden;

}

#chat-header {
  padding: 12px;

}

#chat-messages {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
  color: white;
}

#chat-input-area {
  display: flex;

  gap: 5px;
}

#chat-input {
  flex: 1;

#send-btn {
  background: #3b82f6;
  border: none;
  color: white;

</head>
<body>

    <div id="chat-bubble">💬</div>
  <div id="chat-box">
  <div id="chat-header">ClickOn Support</div>

  <div id="chat-messages"></div>

  <div id="chat-input-area">
    <input id="chat-input" placeholder="Type a message..." />

    <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut,
  createUserWithEmailAndPassword,
  updateProfile
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
// ================================
// FIREBASE CONFIG
// ================================
const firebaseConfig = {
  apiKey: "AIzaSyArDmH7Qbxec6LTqPNj0FFp7kAQAfsfsmg",
  authDomain: "clickon-website.firebaseapp.com",
  projectId: "clickon-website",
  storageBucket: "clickon-website.firebasestorage.app",
  messagingSenderId: "832815696553",
  appId: "1:832815696553:web:c28bdc41070df46949b7b8",
  measurementId: "G-861K6ZSMSJ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


// ================================
// UI ELEMENTS
// ================================
const chatBubble = document.getElementById("chat-bubble");
const chatBox = document.getElementById("chat-box");
const chatInput = document.getElementById("chat-input");
const sendBtn = document.getElementById("send-btn");
const chatMessages = document.getElementById("chat-messages");


// ================================
// TOGGLE CHAT
// ================================
if (chatBubble && chatBox) {
  // prefer toggling a class rather than inline styles; fallback to inline
  chatBubble.addEventListener("click", () => {
    if (chatBox.classList.contains("show")) {
      chatBox.classList.remove("show");
      // also hide inline style if present
      chatBox.style.display = "none";
    } else {
      chatBox.classList.add("show");
      chatBox.style.display = "flex";
    }
  });
}


// ================================
// SEND MESSAGE
// ================================
async function sendMessage(user) {
  const message = chatInput.value;
  if (!message.trim()) return;

  try {
   await addDoc(collection(db, "chats", user.uid, "messages"), {
  text: message,
  sender: "user",
  timestamp: serverTimestamp()
});

// update chat info
await setDoc(doc(db, "chats", user.uid), {
  email: user.email,
  name: user.displayName || "",
  lastMessage: message,
  updatedAt: serverTimestamp()
}, { merge: true });

    chatInput.value = "";
  } catch (error) {
    console.error("Error sending message:", error);
  }
}


// ================================
// REAL TIME CHAT LOADER
// ================================
function loadChat(user) {
  if (!chatMessages) return;

  chatMessages.innerHTML = "Loading messages...";

  const q = query(
    collection(db, "chats", user.uid, "messages"),
    orderBy("timestamp", "asc")
  );

  onSnapshot(q, (snapshot) => {
    chatMessages.innerHTML = "";

    snapshot.forEach((doc) => {
      const msg = doc.data();

      const wrapper = document.createElement("div");
      wrapper.style.margin = "8px 0";
      wrapper.style.textAlign = msg.sender === "user" ? "right" : "left";

      const bubble = document.createElement("span");
      bubble.style.display = "inline-block";
      bubble.style.padding = "8px 12px";
      bubble.style.borderRadius = "12px";
      bubble.style.maxWidth = "80%";
      bubble.style.wordWrap = "break-word";
      bubble.style.background = msg.sender === "user" ? "#3b82f6" : "#334155";
      bubble.style.color = "white";

      // SAFE TEXT (prevents hacking / XSS)
      bubble.textContent = msg.text;

      wrapper.appendChild(bubble);
      chatMessages.appendChild(wrapper);
    });

    chatMessages.scrollTop = chatMessages.scrollHeight;
  });
}


// ================================
// AUTH STATE CONTROL
// ================================
onAuthStateChanged(auth, (user) => {
  const authGuard = document.getElementById("auth-guard");
  const emailElement = document.getElementById("user-email");

  const currentUser = user || auth.currentUser;

  if (!currentUser) {
    window.location.replace("auth.html");
    return;
  }

  if (emailElement) {
    emailElement.textContent =
      currentUser.email || currentUser.displayName || "Signed in user";
  }

  // hide loading screen
  if (authGuard) {
    authGuard.style.opacity = "0";
    setTimeout(() => {
      authGuard.style.display = "none";
    }, 300);
  }

  // START CHAT
  loadChat(currentUser);

  // SEND BUTTON EVENT
  if (sendBtn && chatInput) {
    sendBtn.onclick = () => sendMessage(currentUser);

    chatInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage(currentUser);
    });
  }
});


// ================================
// LOGOUT
// ================================
const logoutBtn = document.getElementById("logout-btn");

if (logoutBtn) {
  logoutBtn.addEventListener("click", async () => {
    try {
      await signOut(auth);
    } catch (error) {
      console.error(error);
    }
  });
}
</script>
</body>
